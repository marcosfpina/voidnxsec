; Audeze Mobius — config.ini
; Gerado pelo audeze-mobius-re kit (voidnxlabs)
;
; ATENÇÃO: Verifique os valores USB (VID, PID, bcdDevice) contra
; o dump original ou lsusb antes de flashar.
; A maioria dos valores de áudio são canônicos para o Mobius.
;
; Para validar: python uac-config-gen.py --validate config.ini
;

[USB]
VID = 0x22D9
PID = 0x0001
PID_DFU = 0x0002
bcdUSB = 0x0200
bcdDevice = 0x0100
Manufacturer = Audeze LLC
Product = Audeze Mobius
SerialNumber = 
MaxPower = 500
SelfPowered = 0
RemoteWakeup = 1

[Audio]
SampleRates = 44100,48000,96000
BitDepth = 24
Channels = 2
ChannelsIn = 2
bInterval = 1
PacketSize = 196
FeedbackEnable = 1
FeedbackInterval = 4
OutTerminalType = 0x0302
InTerminalType = 0x0201
VolumeMin = -127
VolumeMax = 0
VolumeRes = 1
VolumeDefault = 0
MuteEnable = 1

[HID]
Enable = 1
VendorUsagePage = 0xFF00
VendorUsage = 0x0001
ReportSize = 64
PollInterval = 1

[DSP]
Enable = 1
EQBands = 10
EQPresetDefault = 0
SurroundEnable = 1
SurroundDefault = 0
BassBoostEnable = 1
BassBoostDefault = 0

[Bluetooth]
Enable = 1
Version = 3.0
Profile = A2DP,HFP,HSP
DeviceName = Audeze Mobius

[IMU]
Enable = 1
Type = 6DOF
SampleRate = 1000

[Flash]
BaseAddress = 0x08000000
Size = 0x80000
BootloaderSize = 0x8000
AppStart = 0x08008000
ConfigStart = 0x0807E000
ConfigSize = 0x2000

[FwConfig]
Version = 1
ChecksumEnable = 1
EncryptionEnable = 0
SignatureEnable = 0

